<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หลังบ้านแอดมิน - จัดการเงินลูกค้า</title>
    <style>
        #admin-content { display: none; }
        body { font-family: sans-serif; background: #1e1e2f; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #2d2d44; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        h2 { border-bottom: 2px solid #444; padding-bottom: 10px; margin-top: 0; color: #00e676; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; background: #3b3b54; color: white; font-size: 1rem; }
        button { background: #00e676; color: #1e1e2f; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #00b359; }
    </style>
</head>
<body>

    <div id="admin-content" class="card">
        <h2>⚙️ ระบบหลังบ้านแอดมิน</h2>
        <p>จัดการยอดเงินในระบบ (โหมดปลอดภัย)</p>
        
        <label>ชื่อบัญชีลูกค้า:</label>
        <input type="text" value="คุณลูกค้า (thpeas)" disabled style="background:#222; color:#aaa;">
        
        <label for="add-amount">จำนวนเงินที่ต้องการเพิ่มให้ลูกค้า (บาท):</label>
        <input type="number" id="add-amount" placeholder="กรอกจำนวนเงิน">
        
        <button onclick="addMoney()">➕ ยืนยันเพิ่มเงินเข้าไปในระบบ</button>
        <button onclick="logoutAdmin()" style="background: #ff5252; color: white; margin-top: 20px;">🔒 ออกจากระบบแอดมิน</button>
    </div>

    <script>
        function checkAdminAccess() {
            const CORRECT_PASSWORD = "admin1234"; 
            if (sessionStorage.getItem('admin_authenticated') === 'true') {
                document.getElementById('admin-content').style.display = 'block';
                return;
            }

            let passwordInput = prompt("🔒 กรุณากรอกรหัสผ่านเพื่อเข้าสู่ระบบหลังบ้านแอดมิน:");
            if (passwordInput === CORRECT_PASSWORD) {
                alert("✅ รหัสผ่านถูกต้อง ยินดีต้อนรับแอดมิน!");
                sessionStorage.setItem('admin_authenticated', 'true');
                document.getElementById('admin-content').style.display = 'block';
            } else {
                alert("❌ รหัสผ่านไม่ถูกต้อง! ระบบจะพาท่านกลับไปหน้าลูกค้า");
                window.location.href = "/";
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('admin_authenticated');
            alert("🔒 ออกจากระบบแอดมินเรียบร้อยแล้ว");
            window.location.href = "/";
        }

        function addMoney() {
            let amount = parseFloat(document.getElementById('add-amount').value);
            if(!amount || amount <= 0) return alert('กรุณากรอกจำนวนเงินให้ถูกต้อง');
            
            let currentBalance = parseFloat(localStorage.getItem('wallet_balance'));
            if (currentBalance === null || isNaN(currentBalance)) currentBalance = 5000;
            
            let newBalance = currentBalance + amount;
            localStorage.setItem('wallet_balance', newBalance.toString());
            
            // 📝 บันทึกเหตุการณ์เพิ่มเงินลงประวัติธุรกรรมร่วมกัน
            let history = JSON.parse(localStorage.getItem('wallet_history')) || [];
            let now = new Date();
            let timeString = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
            
            history.push({
                time: timeString,
                type: 'ฝาก/เพิ่มเงิน',
                amount: amount
            });
            localStorage.setItem('wallet_history', JSON.stringify(history));
            localStorage.setItem('wallet_update_trigger', Date.now().toString()); // ส่งสัญญาณบอกหน้าลูกค้า
            
            alert('แอดมินเพิ่มเงินจำนวน ' + amount.toLocaleString() + ' บาท เข้าสู่ระบบสำเร็จ!');
            document.getElementById('add-amount').value = '';
        }

        checkAdminAccess();
    </script>
</body>
</html>
