<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หลังบ้านแอดมิน - จัดการสมาชิกและระบบการเงิน</title>
    <style>
        #admin-content { display: none; }
        body { font-family: sans-serif; background: #1e1e2f; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #2d2d44; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 100%; max-width: 450px; margin-bottom: 20px; }
        h2 { border-bottom: 2px solid #444; padding-bottom: 10px; margin-top: 0; color: #00e676; }
        h3 { color: #00e676; margin-top: 5px; }
        input, button, select { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; background: #3b3b54; color: white; font-size: 1rem; }
        button { background: #00e676; color: #1e1e2f; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #00b359; }
        .table-card { max-width: 800px; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; background: #222235; border-radius: 6px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #333; }
        th { background: #151522; color: #00e676; }
    </style>
</head>
<body>

    <div id="admin-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        
        <!-- 👥 1. กล่องสร้างบัญชียูสเซอร์ใหม่ -->
        <div class="card">
            <h2>👥 สร้างบัญชีลูกค้าใหม่</h2>
            <input type="text" id="new-username" placeholder="ตั้งชื่อผู้ใช้งาน (Username) ห้ามซ้ำกัน">
            <input type="text" id="new-password" placeholder="ตั้งรหัสผ่านเข้าใช้งาน (Password)">
            <input type="number" id="new-balance" placeholder="ระบุเงินเริ่มต้นในบัญชี (บาท) เช่น 5000">
            <button onclick="createUser()">✨ ยืนยันสร้างบัญชีผู้ใช้</button>
        </div>

        <!-- 💸 2. กล่องจัดการยอดเงินข้ามบัญชี -->
        <div class="card">
            <h2>💸 เติมเงินให้ลูกค้า</h2>
            <label>เลือกบัญชีผู้ใช้ปลายทาง:</label>
            <select id="user-select">
                <option value="">-- โปรดเลือกรายชื่อยูสเซอร์ --</option>
            </select>
            
            <label for="add-amount">จำนวนเงินที่ต้องการเพิ่มให้ (บาท):</label>
            <input type="number" id="add-amount" placeholder="0.00">
            
            <button onclick="addMoney()">➕ ยืนยันเพิ่มเงินเข้าบัญชี</button>
            <button onclick="logoutAdmin()" style="background: #ff5252; color: white; margin-top: 15px;">🔒 ออกจากระบบแอดมิน</button>
        </div>

        <!-- ⏳ 3. ตารางรายการถอนเงินที่รอแอดมินอนุมัติ -->
        <div class="card table-card">
            <h2>⏳ รายการถอนเงินที่รอแอดมินอนุมัติ</h2>
            <table>
                <thead>
                    <tr>
                        <th>เบอร์ลูกค้า</th>
                        <th>รายละเอียดธนาคาร</th>
                        <th>จำนวนเงิน</th>
                        <th>การจัดการ</th>
                    </tr>
                </thead>
                <tbody id="admin-pending-table">
                    <tr><td colspan="4" style="text-align:center;">กำลังโหลดรายการรออนุมัติ...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 📊 4. ตารางรายชื่อลูกค้าทั้งหมดและยอดเงินในระบบ -->
        <div class="card table-card">
            <h2>📊 รายชื่อลูกค้าและยอดเงินทั้งหมด</h2>
            <table>
                <thead>
                    <tr>
                        <th>ชื่อผู้ใช้งาน</th>
                        <th>รหัสผ่าน</th>
                        <th>ยอดเงินปัจจุบัน</th>
                    </tr>
                </thead>
                <tbody id="admin-user-table"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = '/api/db';

        function checkAdminAccess() {
            const CORRECT_PASSWORD = "admin1234"; 
            if (sessionStorage.getItem('admin_authenticated') === 'true') {
                document.getElementById('admin-content').style.display = 'flex';
                renderAdminData();
                return;
            }

            let passwordInput = prompt("🔒 กรุณากรอกรหัสผ่านเพื่อเข้าสู่ระบบหลังบ้านแอดมิน:");
            if (passwordInput === CORRECT_PASSWORD) {
                alert("✅ รหัสผ่านถูกต้อง ยินดีต้อนรับแอดมิน!");
                sessionStorage.setItem('admin_authenticated', 'true');
                document.getElementById('admin-content').style.display = 'flex';
                renderAdminData();
            } else {
                alert("❌ รหัสผ่านไม่ถูกต้อง! ระบบจะพาท่านกลับไปหน้าลูกค้า");
                window.location.href = "/";
            }
        }

        async function createUser() {
            let username = document.getElementById('new-username').value.trim();
            let password = document.getElementById('new-password').value.trim();
            let initialBalance = parseFloat(document.getElementById('new-balance').value) || 0;

            if(!username || !password) return alert('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'create_user', id: username, password, initial_balance: initialBalance })
                });
                const data = await res.json();
                if(data.error) return alert('❌ ' + data.error);

                alert('✅ สร้างยูสเซอร์ คุณ ' + username + ' สำเร็จแล้ว!');
                document.getElementById('new-username').value = '';
                document.getElementById('new-password').value = '';
                document.getElementById('new-balance').value = '';
                renderAdminData();
            } catch (e) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
            }
        }

        async function addMoney() {
            let targetUser = document.getElementById('user-select').value;
            let amount = parseFloat(document.getElementById('add-amount').value);

            if(!targetUser) return alert('กรุณาเลือกรายชื่อลูกค้าที่ต้องการเติมเงิน');
            if(!amount || amount <= 0) return alert('กรุณากรอกจำนวนเงินให้ถูกต้อง');

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'add', id: targetUser, amount })
                });
                const data = await res.json();
                if(data.error) return alert('❌ ' + data.error);

                alert('✅ เติมเงินให้คุณ ' + targetUser + ' จำนวน ' + amount.toLocaleString() + ' บาท สำเร็จ!');
                document.getElementById('add-amount').value = '';
                renderAdminData();
            } catch (e) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
            }
        }

        async function processWithdraw(username, txId, statusAction) {
            const confirmMsg = statusAction === 'approve_withdraw' ? 'ยืนยันโอนเงินและอนุมัติรายการนี้ใช่หรือไม่?' : 'ยืนยันปฏิเสธรายการนี้ใช่หรือไม่?';
            if(!confirm(confirmMsg)) return;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: statusAction, id: username, tx_id: txId })
                });
                const data = await res.json();
                if(data.error) return alert('❌ ข้อผิดพลาด: ' + data.error);

                alert('✅ ดำเนินการอัปเดตสถานะสำเร็จ!');
                renderAdminData();
            } catch (e) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
            }
        }

        async function renderAdminData() {
            const select = document.getElementById('user-select');
            const tableBody = document.getElementById('admin-user-table');
            const pendingTableBody = document.getElementById('admin-pending-table');
            let currentSelected = select.value;

            select.innerHTML = '<option value="">-- โปรดเลือกรายชื่อยูสเซอร์ --</option>';
            tableBody.innerHTML = '';
            pendingTableBody.innerHTML = '';

            try {
                const res = await fetch(`${API_URL}?is_admin=true`);
                const users = await res.json();
                
                let hasPending = false;

                users.forEach(user => {
                    let opt = document.createElement('option');
                    opt.value = user.id;
                    opt.innerText = user.id;
                    select.appendChild(opt);

                    let row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.password}</td>
                        <td>฿${parseFloat(user.balance).toLocaleString()}</td>
                    `;
                    tableBody.appendChild(row);

                    let history = JSON.parse(user.history || '[]');
                    history.forEach(tx => {
                        if(tx.status === 'รออนุมัติ') {
                            hasPending = true;
                            let pRow = document.createElement('tr');
                            pRow.innerHTML = `
                                <td><b>${user.id}</b><br><small style="color:#aaa;">${tx.time}</small></td>
                                <td>🏦 ${tx.bank}<br>💳 เลขบัญชี: ${tx.account}</td>
                            <td style="color:#ffb300; font-weight:bold;">฿${parseFloat(tx.amount).toLocaleString()}</td>
                            <td>
                                <button onclick="processWithdraw('${user.id}', '${tx.tx_id}', 'approve_withdraw')" style="background:#00e676; color:#121212; padding:6px 10px; font-size:0.85rem; width:auto; margin:2px; display:inline-block;">✔️ อนุมัติ</button>
                                <button onclick="processWithdraw('${user.id}', '${tx.tx_id}', 'reject_withdraw')" style="background:#ff5252; color:white; padding:6px 10px; font-size:0.85rem; width:auto; margin:2px; display:inline-block;">❌ ปฏิเสธ</button>
                            </td>
                        `;
                        pendingTableBody.appendChild(pRow);
                    }
                });
            });

            if(!hasPending) {
                pendingTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888;">🎉 ไม่มีรายการค้างรออนุมัติในระบบ</td></tr>';
            }
            if (currentSelected) select.value = currentSelected;
        } catch (e) {
            pendingTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:red;">โหลดข้อมูลล้มเหลว</td></tr>';
        }
    }

    function logoutAdmin() {
        sessionStorage.removeItem('admin_authenticated');
        window.location.href = "/";
    }

    checkAdminAccess();
</script>
</body>
</html>
