<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบกระเป๋าเงินออนไลน์ (Wallet System)</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; margin-bottom: 25px; }
        h2 { color: #333; margin-bottom: 20px; margin-top: 0; }
        .balance-box { background: #e8f5e9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .balance { font-size: 2.5rem; color: #2e7d32; font-weight: bold; }
        input, button, select { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #0056b3; }
        .logout-btn { background: #777; margin-top: 15px; }
        .logout-btn:hover { background: #555; }
        
        .history-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 650px; }
        .history-title { font-size: 1.2rem; font-weight: bold; color: #444; margin-bottom: 15px; text-align: left; border-left: 4px solid #007bff; padding-left: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
        th { background: #f8f9fa; color: #666; font-weight: 600; }
        .type-add { color: #2e7d32; font-weight: bold; }
        .type-withdraw { color: #c62828; font-weight: bold; }
        .empty-text { color: #888; text-align: center; padding: 20px 0; }
        .bank-info { font-size: 0.8rem; color: #666; margin-top: 4px; font-weight: normal; }
    </style>
</head>
<body>

    <!-- 🔐 1. หน้าจอเข้าสู่ระบบสำหรับลูกค้า -->
    <div id="login-section" class="card">
        <h2>🔐 เข้าสู่ระบบลูกค้า</h2>
        <p style="color: #666; font-size: 0.9rem;">กรุณากรอกข้อมูลเพื่อเข้าสู่กระเป๋าเงินของคุณ</p>
        <input type="text" id="login-username" placeholder="หมายเลขโทรศัพท์">
        <input type="password" id="login-password" placeholder="รหัสผ่าน (Password)">
        <button onclick="loginUser()">🔓 เข้าสู่ระบบ</button>
    </div>

    <!-- 📱 2. หน้าจอหลักกระเป๋าเงิน -->
    <div id="wallet-section" class="card" style="display: none;">
        <h2>📱 ยินดีต้อนรับ เบอร์โทร <span id="display-name" style="color:#007bff;">-</span></h2>
        <div class="balance-box">
            <div>ยอดเงินคงเหลือของคุณ</div>
            <div class="balance">฿ <span id="user-balance">0</span></div>
        </div>
        
        <h3 style="text-align: left; margin: 15px 0 5px 0; color: #444; font-size: 1.1rem;">💸 แจ้งถอนเงิน</h3>
        
        <select id="withdraw-bank">
            <option value="">-- เลือกธนาคาร --</option>
            <option value="กสิกรไทย (KBANK)">กสิกรไทย (KBANK)</option>
            <option value="ไทยพาณิชย์ (SCB)">ไทยพาณิชย์ (SCB)</option>
            <option value="กรุงไทย (KTB)">กรุงไทย (KTB)</option>
            <option value="กรุงเทพ (BBL)">กรุงเทพ (BBL)</option>
            <option value="กรุงศรีอยุธยา (BAY)">กรุงศรีอยุธยา (BAY)</option>
            <option value="ทหารไทยธนชาต (TTB)">ทหารไทยธนชาต (TTB)</option>
            <option value="ออมสิน (GSB)">ออมสิน (GSB)</option>
        </select>
        
        <input type="text" id="withdraw-account-num" placeholder="ระบุหมายเลขบัญชีธนาคาร">
        <input type="number" id="withdraw-amount" placeholder="ระบุจำนวนเงินที่ต้องการถอน (บาท)">
        
        <button onclick="requestWithdraw()">💸 ส่งคำขอถอนเงิน</button>
        <button onclick="logoutUser()" class="logout-btn">🔒 ออกจากระบบ</button>
    </div>

    <!-- 📜 3. ตารางประวัติธุรกรรม -->
    <div id="history-section" class="history-card" style="display: none;">
        <div class="history-title">📜 ประวัติธุรกรรมย้อนหลัง</div>
        <table>
            <thead>
                <tr>
                    <th>วัน-เวลา</th>
                    <th>รายการ</th>
                    <th>จำนวนเงิน</th>
                </tr>
            </thead>
            <tbody id="history-table-body"></tbody>
        </table>
        <div id="empty-history" class="empty-text" style="display: none;">ยังไม่มีประวัติการทำรายการ</div>
    </div>

    <script>
        const API_URL = '/api/db';

        async function loginUser() {
            let uName = document.getElementById('login-username').value.trim();
            let uPass = document.getElementById('login-password').value;
            if(!uName || !uPass) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', id: uName, password: uPass })
                });
                const data = await res.json();
                if(data.error) return alert('❌ ' + data.error);

                sessionStorage.setItem('current_wallet_user', uName);
                alert('✅ เข้าสู่ระบบสำเร็จ!');
                checkLoginStatus();
            } catch (error) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์');
            }
        }

        function checkLoginStatus() {
            let currentUser = sessionStorage.getItem('current_wallet_user');
            if(currentUser) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('wallet-section').style.display = 'block';
                document.getElementById('history-section').style.display = 'block';
                document.getElementById('display-name').innerText = currentUser;
                fetchData();
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('wallet-section').style.display = 'none';
                document.getElementById('history-section').style.display = 'none';
            }
        }

        async function fetchData() {
            let currentUser = sessionStorage.getItem('current_wallet_user');
            if(!currentUser) return;

            try {
                const res = await fetch(`${API_URL}?id=${currentUser}`);
                if(!res.ok) return;
                const dataList = await res.json();
                if (dataList.length === 0) return;
                
                const userData = dataList[0];
                document.getElementById('user-balance').innerText = parseFloat(userData.balance).toLocaleString();

                let tableBody = document.getElementById('history-table-body');
                let emptyText = document.getElementById('empty-history');
                tableBody.innerHTML = '';
                
                let history = JSON.parse(userData.history || '[]');
                if (history.length === 0) {
                    emptyText.style.display = 'block';
                } else {
                    emptyText.style.display = 'none';
                    for (let i = history.length - 1; i >= 0; i--) {
                        let item = history[i];
                        let row = document.createElement('tr');
                        
                        let typeClass = item.type === 'ฝาก/เพิ่มเงิน' ? 'type-add' : 'type-withdraw';
                        let prefix = item.type === 'ฝาก/เพิ่มเงิน' ? '+' : '-';
                        let bankDetails = item.bank ? `<div class="bank-info">🏦 ${item.bank}<br>💳 เลขบัญชี: ${item.account}</div>` : '';
                        
                        let statusBadge = '';
                        if(item.status === 'รออนุมัติ') statusBadge = `<span style="background:#fff3e0; color:#e65100; padding:2px 6px; border-radius:4px; font-size:0.75rem; font-weight:bold; display:inline-block; margin-top:4px;">⏳ รออนุมัติ</span>`;
                        if(item.status === 'สำเร็จ') statusBadge = `<span style="background:#e8f5e9; color:#2e7d32; padding:2px 6px; border-radius:4px; font-size:0.75rem; font-weight:bold; display:inline-block; margin-top:4px;">✅ สำเร็จ</span>`;
                        if(item.status && (item.status.includes('ปฏิเสธ') || item.status.includes('ยกเลิก'))) statusBadge = `<span style="background:#ffebee; color:#c62828; padding:2px 6px; border-radius:4px; font-size:0.75rem; font-weight:bold; display:inline-block; margin-top:4px;">❌ ปฏิเสธ</span>`;

                        row.innerHTML = `
                            <td style="color: #666; font-size: 0.85rem;">${item.time}</td>
                            <td class="${typeClass}">${item.type} ${bankDetails} ${statusBadge}</td>
                            <td class="${typeClass}" style="vertical-align: middle;">${prefix}฿${parseFloat(item.amount).toLocaleString()}</td>
                        `;
                        tableBody.appendChild(row);
                    }
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }
        
        async function requestWithdraw() {
            let currentUser = sessionStorage.getItem('current_wallet_user');
            let bank = document.getElementById('withdraw-bank').value;
            let accountNum = document.getElementById('withdraw-account-num').value.trim();
            let amount = parseFloat(document.getElementById('withdraw-amount').value);
            if(!bank || !accountNum || !amount || amount <= 0) return alert('กรุณากรอกข้อมูลการถอนเงินให้ครบถ้วน');

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'withdraw', id: currentUser, amount, bank, account: accountNum })
                });
                const data = await res.json();
                if(data.error) return alert('❌ ' + data.error);

                alert('✅ ส่งคำขอถอนเงินจำนวน ' + amount.toLocaleString() + ' บาท เรียบร้อยแล้ว!');
                document.getElementById('withdraw-bank').value = '';
                document.getElementById('withdraw-account-num').value = '';
                document.getElementById('withdraw-amount').value = '';
                fetchData();
            } catch (error) {
                alert('ไม่สามารถส่งคำขอถอนเงินได้ในขณะนี้');
            }
        }

        function logoutUser() {
            sessionStorage.removeItem('current_wallet_user');
            checkLoginStatus();
        }
        
        window.onload = checkLoginStatus;
    </script>
</body>
</html>
