<!-- ค้นหาฟังก์ชัน fetchData() ใน index.html แล้วนำส่วนนี้ไปวางอัปเดตแทนที่ -->
<script>
    async function fetchData() {
        let currentUser = sessionStorage.getItem('current_wallet_user');
        if(!currentUser) return;

        const res = await fetch(`${API_URL}?id=${currentUser}`);
        if(!res.ok) return;
        const rawData = await res.json();
        const userData = rawData[0]; // ดึง Object แถวแรกจาก Array ผลลัพธ์

        document.getElementById('user-balance').innerText = parseFloat(userData.balance).toLocaleString();

        let tableBody = document.getElementById('history-table-body');
        let emptyText = document.getElementById('empty-history');
        tableBody.innerHTML = '';
        
        let history = JSON.parse(userData.history || '[]');
        if (history.length === 0) {
            emptyText.style.display = 'block';
        } else {
            emptyText.style.display = 'none';
            for (let i = history.length - 1; i >= 0; i--) {
                let item = history[i];
                let row = document.createElement('tr');
                
                // ออกแบบสีและการจำแนกประเภทรายการ
                let typeClass = item.type === 'ฝาก/เพิ่มเงิน' ? 'type-add' : 'type-withdraw';
                let prefix = item.type === 'ฝาก/เพิ่มเงิน' ? '+' : '-';
                let bankDetails = item.bank ? `<div class="bank-info">🏦 ${item.bank}<br>💳 เลขบัญชี: ${item.account}</div>` : '';
                
                // ระบบ Badge ระบุสถานะงาน
                let statusBadge = '';
                if(item.status === 'รออนุมัติ') statusBadge = `<span style="background:#fff3e0; color:#e65100; padding:2px 6px; border-radius:4px; font-size:0.75rem; font-weight:bold; display:inline-block; margin-top:4px;">⏳ รออนุมัติ</span>`;
                if(item.status === 'สำเร็จ') statusBadge = `<span style="background:#e8f5e9; color:#2e7d32; padding:2px 6px; border-radius:4px; font-size:0.75rem; font-weight:bold; display:inline-block; margin-top:4px;">✅ สำเร็จ</span>`;
                if(item.status.includes('ปฏิเสธ') || item.status.includes('ยกเลิก')) statusBadge = `<span style="background:#ffebee; color:#c62828; padding:2px 6px; border-radius:4px; font-size:0.75rem; font-weight:bold; display:inline-block; margin-top:4px;">❌ ปฏิเสธ</span>`;

                row.innerHTML = `
                    <td style="color: #666; font-size: 0.85rem;">${item.time}</td>
                    <td class="${typeClass}">${item.type} ${bankDetails} ${statusBadge}</td>
                    <td class="${typeClass}" style="vertical-align: middle;">${prefix}฿${parseFloat(item.amount).toLocaleString()}</td>
                `;
                tableBody.appendChild(row);
            }
        }
    }
</script>
