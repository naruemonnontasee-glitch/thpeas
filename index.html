<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลักลูกค้า - ระบบกระเป๋าเงิน</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        .balance-box { background: #e8f5e9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .balance { font-size: 2.5rem; color: #2e7d32; font-weight: bold; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📱 ยินดีต้อนรับ (ลูกค้า)</h2>
        <div class="balance-box">
            <div>ยอดเงินของคุณคงเหลือ</div>
            <div class="balance">฿ <span id="user-balance">5,000</span></div>
        </div>
        
        <label for="withdraw-amount" style="display:block; text-align:left; margin-bottom:5px;">ระบุจำนวนเงินที่ต้องการถอน:</label>
        <input type="number" id="withdraw-amount" placeholder="0.00">
        <button onclick="requestWithdraw()">💸 ส่งคำขอถอนเงิน</button>
    </div>

    <script>
        // ฟังก์ชันดึงยอดเงินจากระบบบันทึกถาวร
        function fetchBalance() {
            let currentBalance = localStorage.getItem('wallet_balance');
            if (currentBalance === null) {
                // ถ้าเพิ่งเปิดเว็บครั้งแรก ให้เงินเริ่มต้นที่ 5,000 บาท
                localStorage.setItem('wallet_balance', '5000');
                currentBalance = '5000';
            }
            document.getElementById('user-balance').innerText = parseFloat(currentBalance).toLocaleString();
        }
        
        // ฟังก์ชันส่งคำขอถอนเงิน
        function requestWithdraw() {
            let amount = parseFloat(document.getElementById('withdraw-amount').value);
            if(!amount || amount <= 0) return alert('กรุณาระบุจำนวนเงิน');
            
            let currentBalance = parseFloat(localStorage.getItem('wallet_balance')) || 0;
            
            if (amount > currentBalance) {
                return alert('ยอดเงินของคุณไม่เพียงพอสำหรับการถอน');
            }
            
            let newBalance = currentBalance - amount;
            localStorage.setItem('wallet_balance', newBalance.toString());
            
            alert('ถอนเงินจำนวน ' + amount.toLocaleString() + ' บาทสำเร็จ ยอดเงินในระบบถูกหักแล้ว!');
            fetchBalance();
            document.getElementById('withdraw-amount').value = '';
        }

        // เช็คยอดเงินทันทีเมื่อโหลดหน้าเว็บ
        fetchBalance();
        
        // คอยอัปเดตยอดเงินแบบ Real-time ถ้าแอดมินกดเติมเงินจากอีกหน้าต่าง
        window.addEventListener('storage', function(e) {
            if (e.key === 'wallet_balance') {
                fetchBalance();
            }
        });
    </script>
</body>
</html>
