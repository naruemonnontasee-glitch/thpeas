<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบกระเป๋าเงินออนไลน์ (Wallet System)</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; margin-bottom: 25px; }
        h2 { color: #333; margin-bottom: 20px; margin-top: 0; }
        .balance-box { background: #e8f5e9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .balance { font-size: 2.5rem; color: #2e7d32; font-weight: bold; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #0056b3; }
        .logout-btn { background: #777; margin-top: 15px; }
        .logout-btn:hover { background: #555; }
        
        .history-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .history-title { font-size: 1.2rem; font-weight: bold; color: #444; margin-bottom: 15px; text-align: left; border-left: 4px solid #007bff; padding-left: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #666; font-weight: 600; }
        .type-add { color: #2e7d32; font-weight: bold; }
        .type-withdraw { color: #c62828; font-weight: bold; }
        .empty-text { color: #888; text-align: center; padding: 20px 0; }
    </style>
</head>
<body>

    <!-- 🔐 1. หน้าจอเข้าสู่ระบบสำหรับลูกค้า (Login Screen) -->
    <div id="login-section" class="card">
        <h2>🔐 เข้าสู่ระบบลูกค้า</h2>
        <p style="color: #666; font-size: 0.9rem;">หมายเลขโทรศัพย์ที่ลงทะเบียนในระบบ</p>
        <input type="text" id="login-username" placeholder="ชื่อผู้ใช้งาน (Username)">
        <input type="password" id="login-password" placeholder="รหัสผ่าน (Password)">
        <button onclick="loginUser()">🔓 เข้าสู่ระบบ</button>
    </div>

    <!-- 📱 2. หน้าจอหลักกระเป๋าเงิน (แสดงหลังล็อกอินสำเร็จ) -->
    <div id="wallet-section" class="card" style="display: none;">
        <h2>📱 ยินดีต้อนรับ คุณ <span id="display-name" style="color:#007bff;">-</span></h2>
        <div class="balance-box">
            <div>ยอดเงินคงเหลือของคุณ</div>
            <div class="balance">฿ <span id="user-balance">0</span></div>
        </div>
        
        <label for="withdraw-amount" style="display:block; text-align:left; margin-bottom:5px;">ระบุจำนวนเงินที่ต้องการถอน:</label>
        <input type="number" id="withdraw-amount" placeholder="0.00">
        <button onclick="requestWithdraw()">💸 ส่งคำขอถอนเงิน</button>
        <button onclick="logoutUser()" class="logout-btn">🔒 ออกจากระบบ</button>
    </div>

    <!-- 📜 3. ตารางประวัติธุรกรรม (แสดงหลังล็อกอินสำเร็จ) -->
    <div id="history-section" class="history-card" style="display: none;">
        <div class="history-title">📜 ประวัติธุรกรรมย้อนหลัง</div>
        <table>
            <thead>
                <tr>
                    <th>วัน-เวลา</th>
                    <th>รายการ</th>
                    <th>จำนวนเงิน</th>
                </tr>
            </thead>
            <tbody id="history-table-body"></tbody>
        </table>
        <div id="empty-history" class="empty-text" style="display: none;">ยังไม่มีประวัติการทำรายการ</div>
    </div>

    <script>
        // ฟังก์ชันจัดการเข้าสู่ระบบของลูกค้า
        function loginUser() {
            let uName = document.getElementById('login-username').value.trim();
            let uPass = document.getElementById('login-password').value;
            
            if(!uName || !uPass) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');
            
            let users = JSON.parse(localStorage.getItem('wallet_users')) || {};
            
            // ตรวจสอบชื่อและรหัสผ่านในระบบ
            if(users[uName] && users[uName].password === uPass) {
                sessionStorage.setItem('current_wallet_user', uName);
                alert('✅ เข้าสู่ระบบสำเร็จ!');
                checkLoginStatus();
            } else {
                alert('❌ ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง');
            }
        }

        // ฟังก์ชันเช็คสถานะการล็อกอินตอนเปิดหน้าเว็บ
        function checkLoginStatus() {
            let currentUser = sessionStorage.getItem('current_wallet_user');
            if(currentUser) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('wallet-section').style.display = 'block';
                document.getElementById('history-section').style.display = 'block';
                document.getElementById('display-name').innerText = currentUser;
                fetchData();
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('wallet-section').style.display = 'none';
                document.getElementById('history-section').style.display = 'none';
            }
        }

        // ฟังก์ชันดึงยอดเงินและประวัติของยูสเซอร์ปัจจุบัน
        function fetchData() {
            let currentUser = sessionStorage.getItem('current_wallet_user');
            if(!currentUser) return;

            let users = JSON.parse(localStorage.getItem('wallet_users')) || {};
            let userData = users[currentUser] || { balance: 0, history: [] };

            document.getElementById('user-balance').innerText = parseFloat(userData.balance).toLocaleString();

            let tableBody = document.getElementById('history-table-body');
            let emptyText = document.getElementById('empty-history');
            tableBody.innerHTML = '';
            
            if (!userData.history || userData.history.length === 0) {
                emptyText.style.display = 'block';
            } else {
                emptyText.style.display = 'none';
                for (let i = userData.history.length - 1; i >= 0; i--) {
                    let item = userData.history[i];
                    let row = document.createElement('tr');
                    let typeClass = item.type === 'ฝาก/เพิ่มเงิน' ? 'type-add' : 'type-withdraw';
                    let prefix = item.type === 'ฝาก/เพิ่มเงิน' ? '+' : '-';

                    row.innerHTML = `
                        <td style="color: #666; font-size: 0.85rem;">${item.time}</td>
                        <td class="${typeClass}">${item.type}</td>
                        <td class="${typeClass}">${prefix}฿${parseFloat(item.amount).toLocaleString()}</td>
                    `;
                    tableBody.appendChild(row);
                }
            }
        }
        
        // ฟังก์ชันเมื่อลูกค้ากดถอนเงิน
        function requestWithdraw() {
            let currentUser = sessionStorage.getItem('current_wallet_user');
            let amount = parseFloat(document.getElementById('withdraw-amount').value);
            if(!amount || amount <= 0) return alert('กรุณาระบุจำนวนเงิน');
            
            let users = JSON.parse(localStorage.getItem('wallet_users')) || {};
            let userData = users[currentUser];
            
            if (amount > parseFloat(userData.balance)) {
                return alert('ยอดเงินของคุณไม่เพียงพอสำหรับการถอน');
            }
            
            // หักเงิน
            userData.balance = parseFloat(userData.balance) - amount;
            
            // บันทึกประวัติ
            let now = new Date();
            let timeString = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
            if(!userData.history) userData.history = [];
            userData.history.push({ time: timeString, type: 'ถอนเงิน', amount: amount });
            
            users[currentUser] = userData;
            localStorage.setItem('wallet_users', JSON.stringify(users));
            localStorage.setItem('wallet_update_trigger', Date.now().toString());
            
            alert('ถอนเงินจำนวน ' + amount.toLocaleString() + ' บาทสำเร็จ!');
            fetchData();
            document.getElementById('withdraw-amount').value = '';
        }

        function logoutUser() {
            sessionStorage.removeItem('current_wallet_user');
            checkLoginStatus();
        }

        checkLoginStatus();
        window.addEventListener('storage', function(e) {
            if (e.key === 'wallet_users' || e.key === 'wallet_update_trigger') fetchData();
        });
        setInterval(fetchData, 2000);
    </script>
</body>
</html>
